receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  otlp/production:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4319
        auth:
          authenticator: bearertokenauth/production

extensions:
  bearertokenauth/production:
    token: ${env:OTEL_INGEST_TOKEN}

processors:
  batch:
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
    spike_limit_mib: 48
  attributes/drop_sensitive_url_data:
    actions:
      - key: http.target
        action: delete
      - key: http.url
        action: delete
      - key: url.full
        action: delete
      - key: url.query
        action: delete

exporters:
  prometheus:
    endpoint: 0.0.0.0:9464
    resource_to_telemetry_conversion:
      enabled: true
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

service:
  extensions: [bearertokenauth/production]
  pipelines:
    traces:
      receivers: [otlp, otlp/production]
      processors: [memory_limiter, attributes/drop_sensitive_url_data, batch]
      exporters: [otlp/jaeger]
    metrics:
      receivers: [otlp, otlp/production]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
